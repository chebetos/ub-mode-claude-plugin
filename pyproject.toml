[project]
name = "ub-mode-claude-plugin-tools"
version = "0.0.0"
description = "Dev tooling that builds and syncs the ub-mode Claude Code plugin from upstream."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "ty==0.0.92",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=tools --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["plugins", "smoke"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["plugins", "smoke"]
